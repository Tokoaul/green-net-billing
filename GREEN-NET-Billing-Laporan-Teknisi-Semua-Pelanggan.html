        <div class="techitem"><small>15 Mbps</small><b>${tech15.filter(x=>x.paid).length} pelanggan lunas</b><span class="muted">${rup(tech15.reduce((a,x)=>a+techFee(x),0))}</span></div>
        <div class="techitem"><small>20 Mbps</small><b>${tech20.filter(x=>x.paid).length} pelanggan lunas</b><span class="muted">${rup(tech20.reduce((a,x)=>a+techFee(x),0))}</span></div>
        <div class="techitem"><small>30 Mbps</small><b>${tech30.filter(x=>x.paid).length} pelanggan lunas</b><span class="muted">${rup(tech30.reduce((a,x)=>a+techFee(x),0))}</span></div>
      </div>
      <div class="reportline"><span>Total komisi pelanggan lunas</span><b class="tech">${rup(paidTech)}</b></div>
      <div class="sectionhead">Komisi per teknisi</div>
      ${(()=>{const map={};data.forEach(x=>techList(x).forEach(t=>{const k=t.toLowerCase();if(!map[k])map[k]={name:t,count:0,total:0};map[k].count++;if(x.paid)map[k].total+=techFee(x)}));const fixed=['Dede','Dai','Agung','Ipal'];fixed.forEach(n=>{const k=n.toLowerCase();if(!map[k])map[k]={name:n,count:0,total:0}});const rows=Object.values(map);return rows.length?rows.map(v=>`<div class="reportline"><span><b>${v.name}</b><br><small class="muted">${v.count} pelanggan • Komisi lunas</small></span><b class="tech">${rup(v.total)}</b></div>`).join(''):'<div class="muted">Belum ada teknisi yang diisi.</div>'})()}
      <div class="muted" style="margin-top:8px">Komisi dasar: 10/15/20 Mbps = Rp30.000, 30 Mbps = Rp50.000. Jika 2 teknisi, dibagi 2; jika 3 teknisi, dibagi 3.</div>
    </div>`;
}

function payLabel(x){return x.paid?(x.paymentMethod||'Belum dipilih'):'Belum Bayar'}
function paymentBadge(x){return x.paid?`<span class="paybadge">${payLabel(x)}</span>`:''}
function choosePayment(){let v=prompt('Pilih metode pembayaran:\n1. Cash\n2. DANA\n3. SeaBank','1');let m={'1':'Cash','2':'DANA','3':'SeaBank'};return m[(v||'').trim()]||null}
function card(x){return `<div class="card customer"><div class="row"><div><div class="name">${x.name}</div><div class="muted">${x.id} • Pemasangan: ${x.install||'-'} • ${x.pkg||'Paket belum diisi'} • Teknisi: ${x.tech||'Belum diisi'}</div></div><span class="badge ${x.paid?'paid':'unpaid'}">${x.paid?'Lunas':'Belum Bayar'}</span></div><div class="muted" style="margin-top:7px">${rup(x.price)} • Jatuh tempo tanggal ${x.due}</div>${x.paid?`<div class="payinfo">💳 Pembayaran: <b>${payLabel(x)}</b></div>`:''}<div class="actions"><button onclick="toggle('${x.id}')">${x.paid?'Tandai Belum Bayar':'Tandai Lunas'}</button><button onclick="edit('${x.id}')">Edit</button><button class="wa" onclick="sendWA('${x.id}')">Chat WhatsApp</button><button class="danger" onclick="del('${x.id}')">Hapus</button></div></div>`}
function bill(x){return `<div class="card customer"><div class="row"><div><div class="name">${x.name}</div><div class="muted">${x.id} • Pemasangan: ${x.install||'-'} • Jatuh tempo tgl ${x.due}</div></div><b>${rup(x.price)}</b></div><div class="tech" style="margin-top:5px">Komisi teknisi: ${x.paid?rup(techFee(x)):'— (Belum Bayar)'}</div>${x.paid?`<div class="payinfo">💳 Metode: <b>${payLabel(x)}</b></div>`:''}<div class="actions"><button onclick="toggle('${x.id}')">${x.paid?'Batalkan Lunas':'Konfirmasi Pembayaran'}</button><button class="wa" onclick="sendWA('${x.id}')">Kirim Pengingat WA</button></div></div>`}
function toggle(id){let x=data.find(a=>a.id===id);if(!x)return;if(x.paid){x.paid=false;x.paymentMethod=''}else{let m=choosePayment();if(!m)return;x.paid=true;x.paymentMethod=m}save()}
let editingId=null;
function edit(id){let x=data.find(a=>a.id===id);if(!x)return;editingId=id;document.getElementById('modalTitle').textContent='Edit Pelanggan';fId.value=x.id;fInstall.value=x.install||'';fName.value=x.name;fWa.value=x.wa;fPkg.value=x.pkg||'';fTech.value=x.tech||'';fPrice.value=x.price;fDue.value=x.due;fPay.value=x.paymentMethod||'';fAddr.value=x.addr||'';openForm()}
function resetForm(){editingId=null;document.getElementById('modalTitle').textContent='Tambah Pelanggan';['fId','fInstall','fName','fWa','fPkg','fTech','fPrice','fDue','fPay','fAddr'].forEach(id=>document.getElementById(id).value='')}function del(id){if(confirm('Hapus pelanggan ini?')){data=data.filter(x=>x.id!==id);save()}}function sendWA(id){let x=data.find(a=>a.id===id);if(!x)return;let wa=(x.wa||'').replace(/\D/g,'');if(wa.startsWith('08'))wa='62'+wa.slice(1);if(!wa){alert('Nomor WhatsApp pelanggan belum diisi.');return}let msg=`Halo ${x.name} 👋%0A%0AIni pengingat tagihan GREEN NET.%0AID: ${x.id}%0APaket: ${x.pkg}%0ATagihan: ${rup(x.price)}%0AJatuh tempo: tanggal ${x.due}.%0A%0ATerima kasih 🙏%0AGREEN NET`;window.open('https://wa.me/'+wa+'?text='+msg,'_blank')}
function tab(id,btn){document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}function openForm(){document.getElementById('modal').classList.add('show')}function closeForm(){document.getElementById('modal').classList.remove('show');resetForm()}function add(){let x={id:fId.value.trim(),install:fInstall.value.trim(),name:fName.value.trim(),wa:fWa.value.trim(),pkg:fPkg.value.trim(),tech:fTech.value.trim(),price:Number(fPrice.value),due:Number(fDue.value),paymentMethod:fPay.value,addr:fAddr.value.trim(),paid:false};if(!x.id||!x.name||!x.price){alert('Isi minimal ID, nama, dan tagihan.');return}if(editingId){let old=data.find(a=>a.id===editingId);if(!old)return;if(data.some(a=>a.id===x.id&&a.id!==editingId)){alert('ID pelanggan sudah ada.');return}x.paid=old.paid;x.paymentMethod=old.paymentMethod||x.paymentMethod||'';data=data.map(a=>a.id===editingId?x:a)}else{if(data.some(a=>a.id===x.id)){alert('ID pelanggan sudah ada.');return}data.push(x)}save();closeForm();tab('cust',document.querySelectorAll('.nav button')[1])}render();
</script></body></html>
