<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GREEN NET Billing</title><style>
:root{--g:#16a34a;--gd:#087a38;--bg:#f4f7f5;--card:#fff;--text:#142018;--muted:#6b776f;--line:#e4ebe6;--red:#dc2626}*{box-sizing:border-box}body{margin:0;font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}button,input{font:inherit}button{cursor:pointer}.app{min-height:100vh;background:var(--bg)}header{background:linear-gradient(135deg,var(--gd),var(--g));color:#fff;padding:22px 18px 20px}.brand{font-size:24px;font-weight:800}.sub{opacity:.85;font-size:13px}.wrap{max-width:980px;margin:auto;padding:16px}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin-top:-4px}.stat,.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:15px;box-shadow:0 5px 18px #00000008}.stat small{color:var(--muted)}.stat b{display:block;font-size:22px;margin-top:5px}.nav{display:flex;gap:8px;overflow:auto;margin:16px 0}.nav button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:10px 14px;white-space:nowrap}.nav button.active{background:var(--g);color:#fff;border-color:var(--g)}.title{display:flex;justify-content:space-between;align-items:center;margin:8px 0 12px}.title h2{font-size:18px;margin:0}.primary{border:0;background:var(--g);color:#fff;border-radius:11px;padding:10px 14px;font-weight:700}.search{width:100%;padding:12px;border:1px solid var(--line);border-radius:11px;margin-bottom:10px}.row{display:flex;justify-content:space-between;gap:10px;align-items:center}.customer{margin-bottom:10px}.name{font-weight:750}.muted{color:var(--muted);font-size:13px}.badge{display:inline-block;border-radius:999px;padding:5px 9px;font-size:12px;font-weight:700}.paid{background:#dcfce7;color:#15803d}.unpaid{background:#fee2e2;color:#b91c1c}.actions{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;font-size:12px}.actions button.primary{border:0;background:var(--g);color:#fff;border-radius:11px;padding:10px 14px;font-weight:700}.actions .wa{background:#eaf9ef;border-color:#b9e7c7;color:#087a38}.modal{position:fixed;inset:0;background:#0007;display:none;align-items:flex-end;justify-content:center;padding:12px}.modal.show{display:flex}.sheet{background:#fff;border-radius:18px 18px 10px 10px;width:min(620px,100%);padding:18px}.sheet h3{margin-top:0}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:5px}.field input{width:100%;padding:11px;border:1px solid var(--line);border-radius:10px}.full{grid-column:1/-1}.empty{text-align:center;color:var(--muted);padding:30px}.reportline{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:12px 0}.danger{color:var(--red)}@media(max-width:650px){.stats{grid-template-columns:1fr 1fr}.grid{grid-template-columns:1fr}.full{grid-column:auto}}
</style></head><body><div class="app"><header><div class="wrap"><div class="brand">GREEN NET</div><div class="sub">Billing RT/RW Net • Versi 1.0</div></div></header><main class="wrap"><section class="stats"><div class="stat"><small>Pelanggan</small><b id="sTotal">0</b></div><div class="stat"><small>Lunas</small><b id="sPaid">0</b></div><div class="stat"><small>Belum Bayar</small><b id="sUnpaid">0</b></div><div class="stat"><small>Pendapatan</small><b id="sIncome">Rp0</b></div></section><nav class="nav"><button class="active" onclick="tab('dash',this)">Dashboard</button><button onclick="tab('cust',this)">Pelanggan</button><button onclick="tab('bill',this)">Tagihan</button><button onclick="tab('report',this)">Laporan</button></nav><section id="dash" class="page"><div class="card"><div class="title"><h2>Ringkasan Tagihan</h2><button class="primary" onclick="openForm()">+ Pelanggan</button></div><div id="recent"></div></div></section><section id="cust" class="page" style="display:none"><div class="title"><h2>Data Pelanggan</h2><button class="primary" onclick="openForm()">+ Tambah</button></div><input id="search" class="search" placeholder="Cari nama / ID pelanggan..." oninput="render()"><div id="customers"></div></section><section id="bill" class="page" style="display:none"><div class="title"><h2>Tagihan Bulan Ini</h2></div><div id="bills"></div></section><section id="report" class="page" style="display:none"><div class="card"><div class="title"><h2>Laporan</h2></div><div id="reportbox"></div></div></section></main></div><div id="modal" class="modal"><div class="sheet"><h3 id="modalTitle">Tambah Pelanggan</h3><div class="grid"><div class="field"><label>ID Pelanggan</label><input id="fId" placeholder="GN004"></div><div class="field"><label>Nama</label><input id="fName" placeholder="Nama pelanggan"></div><div class="field"><label>No. WhatsApp</label><input id="fWa" type="tel" placeholder="08xxxxxxxxxx / 628xxxxxxxxxx"></div><div class="field"><label>Paket</label><input id="fPkg" placeholder="10 Mbps"></div><div class="field"><label>Tagihan / bulan</label><input id="fPrice" type="number" placeholder="125000"></div><div class="field"><label>Tanggal jatuh tempo</label><input id="fDue" type="number" placeholder="5"></div><div class="field full"><label>Alamat</label><input id="fAddr" placeholder="Alamat pelanggan"></div></div><div class="actions"><button class="primary" onclick="add()">Simpan</button><button onclick="closeForm()">Batal</button></div></div></div><script>
const key='green_net_v1';let data=JSON.parse(localStorage.getItem(key)||'null')||[{id:'GN001',name:'Asep',wa:'628123456789',pkg:'10 Mbps',price:125000,due:5,addr:'Banjaran Wetan',paid:true},{id:'GN002',name:'Rina',wa:'628234567890',pkg:'15 Mbps',price:150000,due:10,addr:'Banjaran Wetan',paid:false},{id:'GN003',name:'Dadan',wa:'628345678901',pkg:'20 Mbps',price:175000,due:15,addr:'Banjaran Wetan',paid:false}];
const rup=n=>new Intl.NumberFormat('id-ID',{style:'currency',currency:'IDR',maximumFractionDigits:0}).format(n);function save(){localStorage.setItem(key,JSON.stringify(data));render()}function render(){let q=(document.getElementById('search')?.value||'').toLowerCase();let arr=data.filter(x=>(x.name+' '+x.id).toLowerCase().includes(q));let paid=data.filter(x=>x.paid),un=data.filter(x=>!x.paid);document.getElementById('sTotal').textContent=data.length;document.getElementById('sPaid').textContent=paid.length;document.getElementById('sUnpaid').textContent=un.length;document.getElementById('sIncome').textContent=rup(paid.reduce((a,x)=>a+x.price,0));document.getElementById('customers').innerHTML=arr.length?arr.map(card).join(''):'<div class="card empty">Belum ada pelanggan.</div>';document.getElementById('bills').innerHTML=arr.length?arr.map(bill).join(''):'<div class="card empty">Belum ada tagihan.</div>';document.getElementById('recent').innerHTML=data.slice(0,5).map(x=>`<div class="reportline"><span><b>${x.name}</b><br><small class="muted">${x.id} • ${x.pkg}</small></span><span class="badge ${x.paid?'paid':'unpaid'}">${x.paid?'Lunas':'Belum Bayar'}</span></div>`).join('');document.getElementById('reportbox').innerHTML=`<div class="reportline"><span>Total pelanggan</span><b>${data.length}</b></div><div class="reportline"><span>Sudah bayar</span><b>${paid.length}</b></div><div class="reportline"><span>Belum bayar</span><b class="danger">${un.length}</b></div><div class="reportline"><span>Pendapatan bulan ini</span><b>${rup(paid.reduce((a,x)=>a+x.price,0))}</b></div><div class="reportline"><span>Potensi tagihan belum masuk</span><b>${rup(un.reduce((a,x)=>a+x.price,0))}</b></div>`}
function card(x){return `<div class="card customer"><div class="row"><div><div class="name">${x.name}</div><div class="muted">${x.id} • ${x.pkg}</div></div><span class="badge ${x.paid?'paid':'unpaid'}">${x.paid?'Lunas':'Belum Bayar'}</span></div><div class="muted" style="margin-top:7px">${rup(x.price)} • Jatuh tempo tanggal ${x.due}</div><div class="actions"><button onclick="toggle('${x.id}')">${x.paid?'Tandai Belum Bayar':'Tandai Lunas'}</button><button onclick="edit('${x.id}')">Edit</button><button class="wa" onclick="sendWA('${x.id}')">Chat WhatsApp</button><button class="danger" onclick="del('${x.id}')">Hapus</button></div></div>`}function bill(x){return `<div class="card customer"><div class="row"><div><div class="name">${x.name}</div><div class="muted">${x.id} • Jatuh tempo tgl ${x.due}</div></div><b>${rup(x.price)}</b></div><div class="actions"><button onclick="toggle('${x.id}')">${x.paid?'Batalkan Lunas':'Konfirmasi Pembayaran'}</button><button class="wa" onclick="sendWA('${x.id}')">Kirim Pengingat WA</button></div></div>`}
function toggle(id){let x=data.find(a=>a.id===id);if(x){x.paid=!x.paid;save()}}
let editingId=null;
function edit(id){let x=data.find(a=>a.id===id);if(!x)return;editingId=id;document.getElementById('modalTitle').textContent='Edit Pelanggan';fId.value=x.id;fName.value=x.name;fWa.value=x.wa;fPkg.value=x.pkg;fPrice.value=x.price;fDue.value=x.due;fAddr.value=x.addr||'';openForm()}
function resetForm(){editingId=null;document.getElementById('modalTitle').textContent='Tambah Pelanggan';['fId','fName','fWa','fPkg','fPrice','fDue','fAddr'].forEach(id=>document.getElementById(id).value='')}function del(id){if(confirm('Hapus pelanggan ini?')){data=data.filter(x=>x.id!==id);save()}}function sendWA(id){let x=data.find(a=>a.id===id);if(!x)return;let wa=(x.wa||'').replace(/\D/g,'');if(wa.startsWith('08'))wa='62'+wa.slice(1);if(!wa){alert('Nomor WhatsApp pelanggan belum diisi.');return}let msg=`Halo ${x.name} 👋%0A%0AIni pengingat tagihan GREEN NET.%0AID: ${x.id}%0APaket: ${x.pkg}%0ATagihan: ${rup(x.price)}%0AJatuh tempo: tanggal ${x.due}.%0A%0ATerima kasih 🙏%0AGREEN NET`;window.open('https://wa.me/'+wa+'?text='+msg,'_blank')}
function tab(id,btn){document.querySelectorAll('.page').forEach(p=>p.style.display='none');document.getElementById(id).style.display='block';document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active')}function openForm(){document.getElementById('modal').classList.add('show')}function closeForm(){document.getElementById('modal').classList.remove('show');resetForm()}function add(){let x={id:fId.value.trim(),name:fName.value.trim(),wa:fWa.value.trim(),pkg:fPkg.value.trim(),price:Number(fPrice.value),due:Number(fDue.value),addr:fAddr.value.trim(),paid:false};if(!x.id||!x.name||!x.price){alert('Isi minimal ID, nama, dan tagihan.');return}if(editingId){let old=data.find(a=>a.id===editingId);if(!old)return;if(data.some(a=>a.id===x.id&&a.id!==editingId)){alert('ID pelanggan sudah ada.');return}x.paid=old.paid;data=data.map(a=>a.id===editingId?x:a)}else{if(data.some(a=>a.id===x.id)){alert('ID pelanggan sudah ada.');return}data.push(x)}save();closeForm();tab('cust',document.querySelectorAll('.nav button')[1])}render();
</script></body></html>
